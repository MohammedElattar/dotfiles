id = "vim-navigator"
name = "Vim navigator"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "vim-tmux-navigator for herdr: Ctrl+h/j/k/l across Neovim splits and herdr panes"
platforms = ["linux", "macos"]

[[actions]]
id = "left"
title = "Navigate left (vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "left"]

[[actions]]
id = "down"
title = "Navigate down (vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "down"]

[[actions]]
id = "up"
title = "Navigate up (vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "up"]

[[actions]]
id = "right"
title = "Navigate right (vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "right"]
